name: CI (Pull Request)

on:
  pull_request:
    branches:
      - main

jobs:
  branch-status:
    name: Branch up to date
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch latest main
        run: git fetch --no-tags origin main

      - name: Check pull request branch includes main
        run: |
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Pull request branch includes the latest main commit."
            exit 0
          fi

          echo "Pull request branch is behind main."
          exit 1

  format:
    name: Prettier
    needs: branch-status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check formatting
        run: npx --yes prettier@3 --check .

  frontend:
    name: Frontend (Vue)
    needs: branch-status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

      - name: Build
        run: npm run build
